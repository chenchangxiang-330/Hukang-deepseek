# 云端构建 Android APK（GitHub Actions 方案）
#
# 与 EAS Build 的区别：
#   - 不需要 Expo 账号，只要有 GitHub 仓库即可
#   - 用 GitHub 免费额度（公开仓库不限，私有仓库每月 2000 分钟）
#   - 完全用仓库里已有的 android/ 工程构建，签名沿用 android/app/debug.keystore
#     → 与本地构建出的 APK 签名一致，可以直接覆盖安装
#
# 用法：
#   1. 把项目推到 GitHub
#   2. 在仓库的 Actions 页面手动触发（workflow_dispatch），或向 master 推送
#   3. 构建完成后在 Actions 运行详情页下载 Artifact
#
# 详细说明见 CLOUD_BUILD.md

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - master
      - main

jobs:
  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ⚠️ 不要用 android-actions/setup-android@v3。
      #
      # 它在第 1 次构建时把这个 workflow 跑挂了（28 秒失败）：
      #   [command] .../cmdline-tools/16.0/bin/sdkmanager tools
      #   Warning: Failed to find package 'tools'
      #   Error: ... sdkmanager failed with exit code 1
      # 它要装的 "tools" 是一个早已从 SDK 仓库下架的老包。
      #
      # 而 GitHub 的 ubuntu runner **本来就自带完整 Android SDK**
      # （在 /usr/local/lib/android/sdk，且 ANDROID_HOME 已设置好），
      # 所以这个 action 既多余又会挂 —— 直接不用，只补装缺的组件。
      - name: 安装 Android SDK 组件
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<未设置>}"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "使用 sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version || true

          # 先接受许可，否则安装会卡在交互式确认
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

          echo "===== platforms ====="
          ls -1 "${ANDROID_HOME}/platforms" || true
          echo "===== build-tools ====="
          ls -1 "${ANDROID_HOME}/build-tools" || true

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 单元测试
        run: npm test

      # 注意：本仓库把 expo prebuild 生成的 android/ 一起提交了，
      # 所以这里不需要再跑 npx expo prebuild，直接用仓库里的工程构建。
      # 如果将来改成 CNG（把 /android 加回 .gitignore），
      # 请在这里补一步：npx expo prebuild --platform android --clean
      - name: 构建 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: 校验 APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E '^package:|^application-label:|^native-code'
          "$BT/apksigner" verify --print-certs "$APK"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: HuKang-APK-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

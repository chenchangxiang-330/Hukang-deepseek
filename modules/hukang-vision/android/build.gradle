plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.hukang.vision'
version = '1.0.0'

android {
  namespace "com.hukang.vision"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Google ML Kit 中文文字识别（bundled 模型：装好即可离线识别，不依赖 Play 服务下载）
  implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
  // 读取 EXIF 方向，保证竖拍/横拍的照片都能正确识别
  implementation "androidx.exifinterface:exifinterface:1.3.7"
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.hukang.vision'
version = '1.0.0'

android {
  namespace "com.hukang.vision"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Google ML Kit 中文文字识别（bundled 模型：装好即可离线识别，不依赖 Play 服务下载）
  //
  // 保留它是为了和 PP-OCRv5 做**同机对比**：两者都在包里，由开发者开关切换，
  // 这样同一张照片能当场比出高下，不用来回装两个 APK。
  // 等 PP-OCRv5 被确认全面更好之后，这个依赖和对应代码可以一起删掉。
  implementation "com.google.mlkit:text-recognition-chinese:16.0.1"

  // PaddleOCR PP-OCRv5 推理运行时（ONNX，纯离线，模型随 APK 分发）
  //
  // 版本说明：模型是 opset 14 / IR version 10，1.22.0 完全支持。
  // AAR 约 28MB（含四个 ABI 的 native 库），是包体积增长的主要来源。
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.22.0"

  // 读取 EXIF 方向，保证竖拍/横拍的照片都能正确识别
  implementation "androidx.exifinterface:exifinterface:1.3.7"
}
